# Generates Tests/SPLMarkTests/Vectors/mark-vectors.json from spl-core itself.
# Run from the repository root:
#   cargo run --manifest-path scripts/mark-vectors/Cargo.toml -- <spl-rust checkout> > Tests/SPLMarkTests/Vectors/mark-vectors.json

[package]
name = "spl-swift-mark-vectors"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
spl-core = { git = "https://github.com/solpbc/spl-rust.git", rev = "6ecae85c0606896d9ea29d50f3718ae15ed96821" }
